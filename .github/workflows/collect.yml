name: SearchApi Hourly 5-Route Collector

on:
  schedule:
    - cron: '7 * * * *'  # Runs once every hour at minute :07
  workflow_dispatch:     # Allows manual testing anytime

jobs:
  collect-hourly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python collect_fares.py
